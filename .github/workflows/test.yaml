name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 0 * * *" # daily at midnight

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Deploy
        uses: ./
        with:
          cli-version: nightly
          cwd: "./test"
          compose-files: |
            compose.yaml
            compose.prod.yaml
          command: "compose help"

      - name: Deploy from Git ref
        uses: ./
        with:
          cli-version: main
          cwd: "./test"
          command: "config help"

      - name: Deploy-Empty-Params
        uses: ./
        continue-on-error: true # Ignore dry run error
        with:
          config-env-vars: ""
          cwd: "./test"
          compose-files: ""
          verbose: true
          command: "compose up --dry-run --project-name github-action-test"

      - name: Deploy with env-file
        id: env-file-test
        uses: ./
        continue-on-error: true # Ignore dry run error
        with:
          cwd: "./test"
          compose-files: "compose.envfile.yaml"
          env-file: "action.env"
          command: "compose config --project-name github-action-test"

      - name: Verify env-file interpolation
        shell: bash
        run: |
          echo "${STDOUT}" | grep -q "hello-from-env-file" \
            || { echo "expected env-file value not found in output"; exit 1; }
        env:
          STDOUT: ${{ steps.env-file-test.outputs.stdout }}
